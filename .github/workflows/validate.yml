name: Validate Website Factory

on:
  pull_request:
  push:
    branches:
      - main
      - fix/mcp-build-accuracy-20261121

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build
